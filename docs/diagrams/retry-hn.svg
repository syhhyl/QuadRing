<svg xmlns="http://www.w3.org/2000/svg" width="960" height="944" viewBox="0 0 960 944" role="img" aria-labelledby="title desc">
<title id="title">Physical ring: retry-hn</title>
<desc id="desc">Read panels left to right, top to bottom. Each panel shows one flit on a clockwise four-stop ring. Colored edges and numbered hops show its full route; gray edges are unused. Panels express protocol dependencies, not cycles.</desc>
<defs>
<marker id="REQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
<marker id="RSP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#15803d"/></marker>
<marker id="SNP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#c45c06"/></marker>
<marker id="DAT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
<marker id="idle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#cbd5e1"/></marker>
